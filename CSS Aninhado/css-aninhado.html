<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .div_com_classe {
            color: red;
        }
        div p {
            color: blue;
        }
        div, p {
            font-size: 30px;
            color: green;
        }
    </style>
    <title>CSS Aninhado</title>
</head>
<body>
    <span>Tag SPAN sem classe.</span>

    <p>Tag P sem classe.</p>

    <div>Tag DIV sem classe.</div>

    <div><p> Tag P aninhada dentro de um DIV sem classe.</p></div>

    <div class="div_com_classe">DIV com classe.</div>
</body>
</html>
